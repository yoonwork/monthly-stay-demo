<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stayfold Seoul — 한 달 살기 방 예약 (제안용 데모)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2096%2096%22%20role%3D%22img%22%20aria-labelledby%3D%22title%22%3E%20%20%3Ctitle%20id%3D%22title%22%3EStayfold%20folded%20linen%20mark%3C/title%3E%20%20%3Cg%20fill%3D%22none%22%20stroke%3D%22%232A1D1A%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%20%20%20%20%3Cpath%20d%3D%22M25%2018h34c8%200%2014%206%2014%2014v35c0%206-5%2011-11%2011H36c-7%200-13-6-13-13V29c0-6%205-11%2011-11%22/%3E%20%20%20%20%3Cpath%20d%3D%22M25%2055c10%200%2017%202%2023%207%207%206%2014%208%2024%206%22/%3E%20%20%20%20%3Cpath%20d%3D%22M60%2018v17c0%205%204%209%209%209h4%22/%3E%20%20%3C/g%3E%20%20%3Ccircle%20cx%3D%2231%22%20cy%3D%2227%22%20r%3D%222.2%22%20fill%3D%22%232A1D1A%22/%3E%3C/svg%3E">
<meta name="description" content="외국인 대상 서울 한 달 살기 방 단위 예약 웹 MVP 제안용 데모. 방 검색, 지도, 월할·일할 가격, 호스트 승인 24시간 확보, 카드·PayPal 모의 결제, 환불까지.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light;
  /* 버건디·에스프레소 포인트 (codex_리디자인_방향.md) */
  --brand:#532D2B; --brand-hover:#3F211F; --brand-press:#2F1817; --brand-text:#6B3A37;
  --brand-tint:#EFE4E1; --brand-tint-2:#E2CFCA; --ring:0 0 0 3px rgba(83,45,43,.24); --on-brand:#fff;
  --cta:#171916; --cta-hover:#30322D;
  --espresso:#241B18; --espresso-2:#312521;
  --bg:#F3F0EA; --bg-warm:#E9E3DA; --card:#FFFEFB; --soft:#F7F5F1; --deep:#DDD4C9; --track:#E8E4DE; --line:#D8D3CB; --line-2:#E8E4DE;
  --ink:#191B18; --ink-2:#4F524C; --mut:#6A6D66; --mut-2:#8A8B84;
  --ok:#35634A; --ok-bg:#E2EEE6; --ok-dot:#4C8A66;
  --warn:#7A5716; --warn-bg:#F4EAD1; --warn-dot:#C9993A;
  --bad:#8A3B36; --bad-bg:#F3E2DF; --bad-dot:#B4544C;
  --info:#3E6070; --info-bg:#E2EBEE; --info-dot:#5B8597;
  --neu:#6B625C; --neu-bg:#EAE6E1; --neu-dot:#9C928A;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Iowan Old Style","Times New Roman",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:10px; --r-md:14px; --r-card:18px; --r-photo:24px; --r-xl:24px; --r-hero:28px; --r-pill:999px;
  --sh:0 10px 32px rgba(36,27,24,.07);
  --sh-pop:0 18px 54px rgba(36,27,24,.16);
  --trace-w:420px;
  --gut:clamp(24px,4vw,64px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;letter-spacing:-.01em;overflow-x:hidden}
img{display:block;max-width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
/* 초콜릿 프레임 (PC만, 장식 레이어) */
@media(min-width:1280px){body::after{content:"";position:fixed;inset:0;border:8px solid var(--espresso);pointer-events:none;z-index:90}}

/* demo banner */
.demo-bar{background:var(--espresso);color:#EDE7DF;font-size:12.5px;padding:8px 16px;text-align:center;line-height:1.4;letter-spacing:0}
.demo-bar b{font-weight:650;color:#fff;letter-spacing:.02em}

/* eyebrow */
.eb{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-text);line-height:1.3}
.eb.mut{color:var(--mut)}
.eb.k{letter-spacing:.03em;text-transform:none}
.eb i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(243,240,234,.92);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line-2)}
.top-in{max-width:1392px;margin:0 auto;padding:12px var(--gut);display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;font-size:21px;letter-spacing:-.035em;background:none;border:0;padding:6px 4px;min-height:44px}
.logo i{width:32px;height:32px;display:grid;place-items:center;color:#2A1D1A}
.logo i svg{width:32px;height:32px}
.logo small{font-weight:450;color:var(--mut);font-size:12px;margin-left:2px;letter-spacing:.12em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--track);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:0 16px;min-height:44px;font-size:14px;font-weight:550;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(36,27,24,.12)}
.top .seg-lbl{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:650;letter-spacing:.12em;text-transform:uppercase}
.top .seg.role button[aria-pressed=true]{background:var(--cta);color:#fff}
.lang{display:inline-flex;background:var(--track);border-radius:999px;padding:4px}
.lang button{border:0;background:transparent;border-radius:999px;min-width:44px;min-height:44px;font-size:12.5px;font-weight:650;color:var(--mut);letter-spacing:.06em}
.lang button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(36,27,24,.12)}
.trace-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--espresso);color:#EDE7DF;border-radius:999px;min-height:44px;padding:0 16px 0 14px;font-size:13.5px;font-weight:550}
.trace-btn .cnt{background:#EDE7DF;color:var(--espresso);border-radius:999px;font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center}
.trace-btn .cnt:empty{display:none}

.wrap{max-width:1392px;margin:0 auto;padding:0 var(--gut)}
main{min-height:70vh;transition:padding-right .2s}
@media(min-width:1180px){body.trace-open main,body.trace-open .foot,body.trace-open .top,body.trace-open .demo-bar{padding-right:var(--trace-w)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;min-height:48px;padding:0 22px;font-weight:600;font-size:15px;background:var(--cta);color:#fff;text-decoration:none;letter-spacing:-.01em;transition:background .15s}
.btn:hover{background:var(--cta-hover)}
.btn .dt{width:8px;height:8px;border-radius:50%;background:#fff;flex:none}
.btn.brand{background:var(--cta)}
.btn.brand:hover{background:var(--cta-hover)}
.btn.burg{background:var(--brand)}
.btn.burg:hover{background:var(--brand-hover)}
.btn.line{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.line:hover{background:var(--soft)}
.btn.soft,.btn.grey{background:#EEECE7;color:#30322D}
.btn.soft:hover,.btn.grey:hover{background:#E5E2DB}
.btn.sm{min-height:44px;padding:0 18px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;color:var(--brand-text);font-weight:600;font-size:13.5px;min-height:44px;padding:0 2px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.more{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;min-height:44px;font-weight:600;font-size:14px;color:var(--ink);border-bottom:0}
.more svg{transition:transform .15s}
.more:hover svg{transform:translate(2px,-2px)}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid #CFC8BF;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.circ:hover{background:var(--cta);border-color:var(--cta);color:#fff}
.circ.fill{background:var(--brand);border-color:var(--brand);color:#fff}
.star{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:46px;height:46px;padding:0 8px;border-radius:999px;background:var(--cta);color:#fff;font-size:13px;font-weight:650;letter-spacing:0}
.star svg{color:#E8C47A}
.chipx{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:0 12px;height:30px;font-size:12.5px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(36,27,24,.1)}

/* guest sub nav */
.gnav{display:flex;align-items:center;gap:4px;padding:18px 0 0}
.tab{border:0;background:none;min-height:44px;padding:0 16px;margin-right:2px;font-size:14.5px;font-weight:550;color:var(--mut);border-radius:999px}
.tab[aria-current=true]{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2)}
.tab .b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--brand);color:#fff;font-size:11.5px;margin-left:6px;padding:0 6px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:stretch;padding:28px 0 0}
.hero-l{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:8px 0 64px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero .rate{display:inline-flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:5px 14px 5px 6px;font-size:13px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.hero .rate b{display:inline-flex;align-items:center;gap:4px;background:var(--cta);color:#fff;border-radius:999px;padding:3px 10px;font-weight:650;font-size:12.5px}
.hero .rate b svg{color:#E8C47A}
.hero h1{margin:0;font-size:96px;line-height:1;letter-spacing:-.06em;font-weight:300;max-width:780px;text-wrap:balance}
.hero h1 em{font-style:normal;font-weight:600}
.hero p{margin:22px 0 0;color:var(--ink-2);font-size:18px;line-height:1.65;max-width:52ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.hero-ph{position:relative;border-radius:var(--r-hero);overflow:hidden;min-height:480px;background:var(--deep)}
.hero-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-ph .star{position:absolute;right:16px;top:16px}
.hero-ph .cap{position:absolute;left:16px;top:16px;right:80px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.hero-ph .cap span{background:rgba(255,254,251,.94);border-radius:16px;padding:10px 14px;font-size:13px;line-height:1.4;color:var(--ink-2)}
.hero-ph .cap span b{display:block;color:var(--ink);font-size:14.5px;font-weight:650}
.has{display:flex;flex-wrap:wrap;align-items:center;gap:8px 26px;padding:22px 0 0;margin-top:18px}
.has .eb{margin-right:6px}
.has span{font-size:14.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}
.has span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mut-2)}

/* search panel */
.search{position:relative;z-index:2;margin-top:-44px;background:var(--card);border-radius:28px;display:grid;grid-template-columns:1.2fr 1fr .8fr 1fr auto;align-items:stretch;padding:8px;box-shadow:var(--sh)}
.fld{display:flex;flex-direction:column;justify-content:center;padding:6px 20px 0;border-right:1px solid var(--line-2);min-height:72px}
.fld:nth-last-child(2){border-right:0}
.fld label{font-size:11.5px;font-weight:650;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.fld select,.fld input{border:0;background:transparent;font-size:16px;font-weight:550;padding:0;min-height:44px;width:100%;outline:none}
.fld:focus-within{background:var(--soft);border-radius:20px}
.search .go{align-self:center;margin:4px;border:0;background:var(--cta);color:#fff;border-radius:999px;padding:0 28px;min-height:58px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:10px}
.search .go:hover{background:var(--cta-hover)}
.rule-note{font-size:13px;color:var(--mut);margin:12px 4px 0;max-width:none}

/* section heads */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 26px}
.sh h2{margin:10px 0 0;font-size:40px;line-height:1.12;letter-spacing:-.035em;font-weight:600;text-transform:none}
.sh p{margin:8px 0 0;color:var(--ink-2);max-width:56ch}
.navr{display:flex;align-items:center;gap:14px;flex:none}
.navr .pc{font-size:13px;font-weight:600;color:var(--ink-2);min-width:44px}
.navr .pc,.gal-cnt{font-family:var(--serif);font-weight:400;letter-spacing:.04em}
.pline{position:relative;width:160px;height:2px;background:#CEC8C0;border-radius:2px;overflow:hidden}
.pline i{position:absolute;top:0;bottom:0;left:0;width:30%;background:var(--brand);border-radius:2px;transition:left .2s,width .2s}

/* featured slider */
.feat{padding:84px 0 20px}
.feat,.notes .wrap{container-type:inline-size}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100cqw - 54px)/3.6);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track>*{scroll-snap-align:start}
.fcard{border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.fcard .ph{position:relative;border-radius:var(--r-photo);overflow:hidden;aspect-ratio:4/4.6;background:var(--deep)}
.fcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.fcard:hover .ph img{transform:scale(1.04)}
.fcard .ph .star{position:absolute;right:12px;top:12px;min-width:42px;height:42px;font-size:12.5px}
.fcard .cap{display:flex;justify-content:space-between;gap:10px;margin-top:12px;align-items:baseline}
.fcard .cap b{font-size:16px;font-weight:600;letter-spacing:-.02em}
.fcard .cap span{font-size:13.5px;color:var(--mut);white-space:nowrap}
.fintro{background:var(--card);border-radius:var(--r-photo);padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.fintro h3{margin:14px 0 0;font-size:28px;line-height:1.2;letter-spacing:-.035em;font-weight:500}
.fintro p{margin:10px 0 0;color:var(--ink-2);font-size:14.5px}

/* giant word + segments */
.big{text-align:center;padding:96px 0 34px;overflow:hidden}
.big .w{display:block;font-size:clamp(54px,11vw,168px);line-height:.86;letter-spacing:-.065em;font-weight:250;margin:18px 0 10px;color:var(--ink);white-space:nowrap}
.big p{margin:12px auto 0;color:var(--ink-2);max-width:52ch}
.areas{display:flex;justify-content:center;margin-top:30px}
.areas .seg{background:#E8E4DE;padding:5px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.areas .seg::-webkit-scrollbar{display:none}
.areas .seg button{min-height:44px;padding:0 20px;font-size:14.5px}
.areas .seg button[aria-pressed=true]{background:var(--brand);color:#fff;box-shadow:none}

/* results */
.res-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:30px 0 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.res-head h2{margin:0;font-size:22px;letter-spacing:-.03em;font-weight:600}
.res-head .mut{color:var(--mut);font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,8.4fr) minmax(0,3.6fr);gap:32px;align-items:start;padding-bottom:84px}
.list{display:grid;gap:0;container-type:inline-size}
.mapcol{position:sticky;top:96px;padding-top:18px}
.mapcol .mh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.mapcol .mh b{font-size:15px;font-weight:600}
.mapcol .mh span{font-size:13px;color:var(--mut)}

/* listing row (ref1) */
.room{display:grid;grid-template-columns:1.3fr 1fr 1.2fr 1fr;gap:16px;padding:22px 0;border-bottom:1px solid var(--line-2);align-items:stretch;border-radius:0}
.room .phb{border:0;padding:0;background:none;display:block;text-align:left;border-radius:var(--r-photo)}
.room .ph{position:relative;border-radius:var(--r-photo);overflow:hidden;height:100%;min-height:230px;background:var(--deep)}
.room .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.room:hover .ph img,.room.hl .ph img,.room:focus-within .ph img{transform:scale(1.04)}
.room{position:relative}
.room::before{content:"";position:absolute;left:-14px;top:22px;bottom:22px;width:2px;border-radius:2px;background:var(--brand);opacity:0;transition:opacity .2s}
.room:hover::before,.room.hl::before,.room:focus-within::before{opacity:1}
.room .ph .star{position:absolute;left:12px;top:12px;height:34px;min-width:0;padding:0 10px;font-size:12.5px}
.room .tagr{position:absolute;left:12px;bottom:12px;background:rgba(255,254,251,.94);border-radius:999px;font-size:12px;font-weight:600;padding:5px 11px}
.room .ttl{display:flex;flex-direction:column;padding:6px 4px}
.room h3{margin:10px 0 6px;font-size:21px;letter-spacing:-.025em;line-height:1.28;font-weight:600}
.room h3 button{all:unset;cursor:pointer}
.room h3 button:focus-visible{box-shadow:var(--ring);border-radius:6px}
.room .meta{font-size:13.5px;color:var(--mut);line-height:1.55}
.room .ttl .more{margin-top:auto}
.pcard{background:var(--card);border-radius:var(--r-card);padding:18px}
.pcard .pr{font-size:26px;font-weight:650;letter-spacing:-.035em;line-height:1.1}
.pcard .pr small{font-size:13px;font-weight:450;color:var(--mut);letter-spacing:0}
.pcard .est{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.pcard .bi{margin-top:14px;font-size:11.5px;font-weight:650;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.info{margin:8px 0 0;padding:0;list-style:none}
.info li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13.5px}
.info li span{color:var(--mut)}
.info li b{font-weight:600;text-align:right}
.fcol{padding:6px 0 0 18px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:16px}
.fcol .ft{display:flex;gap:12px;align-items:flex-start}
.fcol .ft i{width:36px;height:36px;border-radius:50%;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;flex:none}
.fcol .ft b{display:block;font-size:14px;font-weight:600}
.fcol .ft span{display:block;font-size:12.5px;color:var(--mut);line-height:1.45;margin-top:1px}
.fcol .btn{margin-top:auto}
@container (max-width:840px){
  .room{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-areas:"ph ttl" "ph pc" "fc fc"}
  .room .phb{grid-area:ph}.room .ttl{grid-area:ttl}.room .pcard{grid-area:pc}.room .fcol{grid-area:fc;flex-direction:row;flex-wrap:wrap;align-items:center;border-left:0;padding:0}
  .room .fcol .ft{flex:1 1 200px}
  .room .fcol .btn{margin-top:0;flex:1 1 100%}
}
@container (max-width:520px){
  .room{grid-template-columns:1fr;grid-template-areas:"ph" "ttl" "pc" "fc";gap:14px}
  .room .ph{min-height:0;height:auto;aspect-ratio:4/3}
  .room .ttl{padding:0 2px}
  .room h3{margin:8px 0 4px}
  .room .fcol{flex-direction:column;align-items:stretch}
  .room .fcol .ft{flex:none}
  .room .fcol .btn{flex:none;width:100%}
  .room .pcard{padding:16px}
  .room .info{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .room .info li{flex-direction:column;gap:0;padding:8px 0}
  .room .info li b{text-align:left}
  .room .fcol{background:none;padding:0}
  .room .fcol .ft{display:none}
  .room .ttl .more{display:none}
}
.empty{background:var(--card);border-radius:var(--r-card);padding:40px 24px;text-align:center;color:var(--ink-2);grid-column:1/-1;margin-top:18px}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:4px}

/* map */
.map{position:relative;border-radius:var(--r-hero);overflow:hidden;background:#EFEAE1;height:min(70vh,760px);min-height:480px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:var(--card);color:var(--ink);font-weight:650;font-size:13px;border-radius:999px;padding:0 14px;min-height:44px;box-shadow:0 2px 6px rgba(36,27,24,.18),0 6px 14px rgba(36,27,24,.1);white-space:nowrap;transition:transform .15s,background .15s}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.pin.on,.pin:hover{background:var(--brand);color:#fff;transform:translate(-50%,-100%) scale(1.08);z-index:3}
.pin small{font-weight:600;opacity:.7;font-size:11px}
.map-note{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.map-note span{background:rgba(255,254,251,.92);border-radius:12px;padding:6px 10px;font-size:11.5px;color:var(--ink-2);line-height:1.35}
.map-peek{margin-top:12px}
.peek{display:flex;gap:14px;background:var(--card);border:0;border-radius:20px;padding:10px;align-items:center;width:100%;text-align:left;box-shadow:var(--sh)}
.peek img{width:84px;height:72px;object-fit:cover;border-radius:14px;flex:none}
.peek b{display:block;font-size:14.5px;font-weight:600}
.peek span{font-size:13px;color:var(--mut)}

/* dark video band (ref2) */
.vband{position:relative;min-height:440px;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;background:var(--espresso)}
.vband>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.vband::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,12,.35),rgba(20,14,12,.7));z-index:1}
.vband .vin{position:relative;z-index:2;padding:64px 24px;max-width:760px}
.vband .eb{color:#E7D9CF}
.vband h2{margin:16px 0 0;font-size:52px;line-height:1.08;letter-spacing:-.045em;font-weight:300}
.vband p{margin:16px auto 0;color:#E4DBD3;max-width:50ch;font-size:16px}
.play{width:88px;height:88px;border-radius:50%;border:0;background:rgba(255,254,251,.96);color:var(--espresso);display:grid;place-items:center;margin:0 auto 26px;box-shadow:0 0 0 12px rgba(255,255,255,.14);transition:transform .2s}
.play:hover{transform:scale(1.06)}
.vband .btn{margin-top:26px;background:#fff;color:var(--ink)}
.vband .btn:hover{background:#EDE7DF}

/* testimonials (ref2) */
.notes{background:var(--bg-warm);padding:84px 0 90px}
.notes .track{grid-auto-columns:calc((100cqw - 20px)/2.15)}
.note{background:var(--soft);border-radius:var(--r-photo);padding:16px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;min-height:260px}
.note>img{width:100%;height:100%;object-fit:cover;border-radius:18px}
.note .tx{display:flex;flex-direction:column;padding:8px 6px 4px 0}
.note .pn{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.note blockquote{margin:14px 0 18px;font-size:17px;line-height:1.6;letter-spacing:-.015em;color:var(--ink)}
.note .who{display:flex;align-items:center;gap:10px;margin-top:auto}
.note .av{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:650;font-size:14px;flex:none}
.note .who b{display:block;font-size:14px;font-weight:600}
.note .who span{font-size:12.5px;color:var(--mut)}
.tagx{display:inline-block;border-radius:999px;background:var(--card);padding:3px 10px;font-size:11.5px;font-weight:650;color:var(--brand-text);letter-spacing:0;text-transform:none}

.endcta{padding:96px 0 104px;text-align:center}
.endcta h2{margin:16px auto 30px;font-size:64px;line-height:1.05;letter-spacing:-.055em;font-weight:300;max-width:16ch;text-wrap:balance}
.endcta .acts{justify-content:center}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;font-weight:550;color:var(--ink-2);min-height:44px;padding:0 16px 0 10px;margin:20px 0 16px;box-shadow:inset 0 0 0 1px var(--line-2)}
.gal{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:240px 240px;gap:12px}
.gal img{width:100%;height:100%;min-height:0;object-fit:cover;border-radius:var(--r-photo)}
.gal img:first-child{grid-row:1/3;border-radius:var(--r-hero)}
.gal-wrap{position:relative}
.gal-cnt{display:none}
.det{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:56px;padding:40px 0 80px;align-items:start}
.det h1{margin:12px 0 0;font-size:48px;line-height:1.08;letter-spacing:-.045em;font-weight:400}
.det .sub{color:var(--ink-2);margin-top:10px;font-size:16px}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 8px;padding:0}
.facts span{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);background:var(--card);border-radius:999px;padding:8px 14px}
.sec{padding:30px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{font-size:12px;margin:0 0 14px;letter-spacing:.14em;text-transform:uppercase;font-weight:650;color:var(--brand-text)}
.sec p{margin:0;color:var(--ink-2);font-size:16px;line-height:1.7;max-width:62ch}
.amen{columns:2;column-gap:24px;margin:0;padding:0;list-style:none}
.amen li{padding:8px 0;display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink);break-inside:avoid;border-bottom:1px solid var(--line-2)}
.amen li svg{color:var(--brand)}
.tl{margin-top:6px}
.tl-bar{position:relative;height:38px;background:var(--ok-bg);border-radius:999px;overflow:hidden}
.tl-bar .blk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#D8D1C7 0 6px,#CCC4B9 6px 12px)}
.tl-bar .blk.hold{background:repeating-linear-gradient(135deg,#EFDDB4 0 6px,#E6CF9A 6px 12px)}
.tl-bar .sel{position:absolute;top:4px;bottom:4px;border:2px solid var(--brand);border-radius:999px;background:var(--brand-tint)}
.tl-ax{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.minimap .map{max-width:600px;height:auto;min-height:0;aspect-ratio:600/470}

.book{position:sticky;top:96px;background:var(--card);border-radius:var(--r-hero);padding:26px;box-shadow:var(--sh)}
.book .p1{font-size:30px;font-weight:650;letter-spacing:-.04em}
.book .p1 small{font-size:14px;font-weight:450;color:var(--mut);letter-spacing:0}
.book .usd{font-size:12.5px;color:var(--mut)}
.dates{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:20px;margin-top:18px;overflow:hidden}
.dates .fld{border-right:1px solid var(--line-2);min-height:64px;padding:8px 16px}
.dates .fld:last-child{border-right:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:0;background:var(--track);border-radius:999px;min-height:44px;padding:0 15px;font-size:13.5px;font-weight:550;color:var(--ink-2);position:relative}
.chip::before{content:"";position:absolute;inset:-4px 0}
.chip[aria-pressed=true]{background:var(--brand);color:#fff}
.rcpt{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
.rl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14.5px}
.rl .f{display:block;font-size:12px;color:var(--mut);font-family:var(--mono);margin-top:1px}
.rl.tot{border-top:1px solid var(--ink);margin-top:8px;padding-top:12px;font-weight:650;font-size:18px;letter-spacing:-.02em}
.rl.dep{color:var(--ink-2)}
.flash{animation:fl .9s}
@keyframes fl{0%{background:var(--brand-tint-2)}100%{background:transparent}}
.err{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.hint{font-size:13px;color:var(--mut);margin-top:12px;line-height:1.55}
.mbar{display:none}

/* status pills */
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:12.5px;font-weight:600;padding:4px 11px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.st.pending{background:var(--neu-bg);color:var(--neu)}
.st.approved{background:var(--warn-bg);color:var(--warn)}
.st.paid,.st.confirmed{background:var(--ok-bg);color:var(--ok)}
.st.rejected,.st.expired{background:#EAE6E1;color:#6B625C}
.st.refunded,.st.partially_refunded{background:var(--info-bg);color:var(--info)}

/* page heads (trips/host/sys) */
.phead{padding:36px 0 22px}
.phead h1{margin:12px 0 0;font-size:56px;line-height:1.04;letter-spacing:-.05em;font-weight:300}
.phead p{margin:10px 0 0;color:var(--ink-2);max-width:62ch}

/* trips */
.trips{display:grid;gap:18px;padding:8px 0 80px;max-width:960px}
.trip{background:var(--card);border-radius:var(--r-hero);padding:16px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;box-shadow:var(--sh)}
.trip>img{width:220px;height:100%;min-height:200px;object-fit:cover;border-radius:20px}
.trip>div{padding:8px 8px 6px 0}
.trip h3{margin:0;font-size:22px;letter-spacing:-.03em;font-weight:600}
.trip .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.trip .d{color:var(--ink-2);font-size:14px;margin-top:4px}
.steps{display:flex;gap:6px;margin:18px 0 4px}
.steps div{flex:1;font-size:12px;color:var(--mut);letter-spacing:.02em}
.steps div::before{content:"";display:block;height:2px;border-radius:2px;background:#CEC8C0;margin-bottom:8px}
.steps div.on::before{background:var(--brand)}
.steps div.on{color:var(--ink);font-weight:600}
.box{margin-top:16px;border-radius:20px;padding:16px 18px;background:var(--soft)}
.box.warn{background:var(--warn-bg)}
.box.ok{background:var(--ok-bg)}
.box p{margin:0 0 10px;font-size:14px}
.cd{font-family:var(--mono);font-weight:600;font-size:34px;letter-spacing:-.01em;color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* host */
.host-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:36px 0 10px}
.host-head h1{margin:12px 0 0;font-size:56px;line-height:1.04;letter-spacing:-.05em;font-weight:300}
.host-head p{margin:10px 0 0;color:var(--ink-2);max-width:62ch}
.kpis{display:flex;gap:10px}
.kpis div{font-size:12.5px;color:var(--mut);background:var(--card);border-radius:20px;padding:14px 18px;min-width:120px}
.kpis b{display:block;font-size:34px;color:var(--ink);letter-spacing:-.04em;font-weight:500;line-height:1.1}
.panel{background:var(--card);border-radius:var(--r-xl);overflow:hidden;margin-bottom:24px;box-shadow:var(--sh)}
.prow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.1fr) minmax(0,1fr) 300px;gap:16px;align-items:center;padding:18px 22px;border-top:1px solid var(--line-2)}
.prow:first-child{border-top:0}
.prow>.acts{justify-content:flex-end}
.who b{display:block;font-size:15.5px;font-weight:600}
.who span,.cell span{font-size:13px;color:var(--mut)}
.cell{font-size:14px}
.msg{grid-column:1/-1;margin-top:-6px;font-size:13.5px;color:var(--ink-2);background:var(--soft);border-radius:14px;padding:9px 14px}
.conflict{grid-column:1/-1;margin-top:-6px;font-size:13px;color:var(--bad);background:var(--bad-bg);border-radius:14px;padding:9px 14px}
.ph-h{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;background:var(--soft);border-bottom:1px solid var(--line-2)}
.ph-h b{font-size:16px;font-weight:600}
.ph-h span{font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.rhead{display:flex;gap:12px;align-items:center;min-width:0}
.rrow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr)) minmax(0,1.1fr) auto;gap:12px;align-items:center;padding:14px 22px;border-top:1px solid var(--line-2)}
.rrow:first-of-type{border-top:0}
.rrow img{flex:none;width:64px;height:52px;object-fit:cover;border-radius:12px}
.rrow label{display:block;font-size:11px;color:var(--mut);font-weight:650;letter-spacing:.08em;text-transform:uppercase}
.in{width:100%;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;font-size:14px;background:var(--card)}
.in:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
.htabs{display:flex;gap:4px;margin:18px 0 20px;background:var(--track);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.htabs .tab{margin:0}
.htabs .tab[aria-current=true]{box-shadow:0 1px 3px rgba(36,27,24,.12)}

/* system view */
.sys{padding-top:36px;padding-bottom:80px}
.sys h1{font-size:56px;letter-spacing:-.05em;line-height:1.06;margin:12px 0 0;max-width:980px;text-wrap:balance;font-weight:300}
.sys .lead{font-size:17px;color:var(--ink-2);max-width:760px;margin:16px 0 0;line-height:1.7}
.sys h2{font-size:30px;letter-spacing:-.035em;margin:72px 0 8px;font-weight:600}
.sys h2+p{margin:0 0 20px;color:var(--ink-2);max-width:70ch}
.sys .eb{margin-top:0}
.layers{display:grid;gap:10px}
.ly{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:center;border-radius:20px;padding:18px 22px;background:var(--card)}
.ly.keep{background:transparent;box-shadow:inset 0 0 0 1px var(--line);border:0;background-image:none}
.ly.keep{outline:1px dashed var(--line);outline-offset:-1px;box-shadow:none}
.ly.core{background:var(--espresso);color:#fff}
.ly.core .ly-k span{color:#CDBFB4}
.ly-k b{display:block;font-size:16px;font-weight:600}
.ly-k span{font-size:12.5px;color:var(--mut)}
.ly-v{display:flex;flex-wrap:wrap;gap:6px}
.ly-v span{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink)}
.ly.core .ly-v span{background:var(--espresso-2);color:#EDE7DF}
.ly.keep .ly-v span{background:var(--card)}
.er{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.er-col{display:grid;gap:16px;align-content:start}
.er-col>em{font-style:normal;font-size:11.5px;font-weight:650;color:var(--brand-text);letter-spacing:.14em;text-transform:uppercase}
.tbl{background:var(--card);border-radius:18px;overflow:hidden;font-size:13px}
.tbl header{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line-2);font-family:var(--mono);font-weight:700;font-size:13px}
.tbl header span{font-family:var(--font);font-weight:600;font-size:11.5px;color:var(--mut)}
.tbl div{display:flex;justify-content:space-between;gap:8px;padding:6px 14px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tbl div i{font-style:normal;color:var(--mut-2)}
.tbl div.fk i{color:var(--brand-text)}
.tbl div.pk{color:var(--ink);font-weight:700}
.tbl div.cx{background:var(--brand-tint);color:var(--brand-text)}
.sm-wrap{background:var(--card);border-radius:var(--r-xl);padding:16px;overflow:hidden}
.sm-wrap svg{width:100%;height:auto;display:block}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;margin:0;padding:0;list-style:none}
.rules li{padding:18px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:24px 1fr;gap:12px}
.rules li>svg{color:var(--brand)}
.rules b{display:block;font-weight:600}
.rules span{font-size:14px;color:var(--ink-2)}
.pg{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r-card);overflow:hidden;font-size:14px}
.pg th,.pg td{text-align:left;padding:13px 16px;border-top:1px solid var(--line-2);vertical-align:top}
.pg th{background:var(--soft);font-size:11.5px;color:var(--mut);font-weight:650;border-top:0;letter-spacing:.1em;text-transform:uppercase}
.pg td:first-child{font-weight:600;white-space:nowrap}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.no{background:var(--bad-bg);color:var(--bad)}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:0 48px;background:var(--card);border-radius:var(--r-xl);padding:6px 24px}
.test{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line-2)}
.test>svg{color:var(--brand);flex:none;margin-top:3px}
.test:nth-child(-n+2){border-top:0}
.test b{display:block;font-size:14.5px;font-weight:600}
.test span{font-size:13.5px;color:var(--ink-2)}
.stack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:var(--r-xl);background:var(--card);overflow:hidden}
.stack div{padding:20px;border-left:1px solid var(--line-2)}
.stack div:first-child{border-left:0}
.stack b{display:block;font-size:11.5px;color:var(--mut);font-weight:650;letter-spacing:.12em;text-transform:uppercase}
.stack span{display:block;font-size:16px;font-weight:600;margin-top:6px}
.stack small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.45}

/* trace (espresso) */
.trace{position:fixed;z-index:95;top:0;right:0;bottom:0;width:var(--trace-w);background:var(--espresso);color:#EDE7DF;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
body.trace-open .trace{transform:none}
.trace header{padding:20px 18px 14px;border-bottom:1px solid #3A2D28;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.trace header b{font-size:15px;display:block;font-weight:600}
.trace header span{font-size:12px;color:#A99D92;line-height:1.45;display:block;margin-top:4px}
.trace .x{border:0;background:var(--espresso-2);color:#fff;border-radius:50%;width:44px;height:44px;flex:none;display:grid;place-items:center}
.tlog{flex:1;overflow:auto;padding:10px 14px 24px}
.ev{background:var(--espresso-2);border-left:3px solid #4A3A33;border-radius:4px 12px 12px 4px;padding:9px 12px 10px;margin:8px 0;font-family:var(--mono);font-size:12px;line-height:1.55}
.ev .h{display:flex;justify-content:space-between;gap:8px;color:#fff;font-weight:700}
.ev .h time{color:#A99D92;font-weight:400}
.ev .l{color:#D2C7BD;white-space:pre-wrap;word-break:break-word}
.ev.k-req{border-color:#9DB4C8}.ev.k-db{border-color:#8DB59A}.ev.k-hook{border-color:#D1B370}.ev.k-pg{border-color:#D29A8E}.ev.k-err{border-color:#E07A70}.ev.k-job{border-color:#B7A6C4}
.ev.new{animation:evin .6s}
@keyframes evin{from{background:#4A3A33}to{background:var(--espresso-2)}}
.trace .tlegend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:12px 18px;border-top:1px solid #3A2D28;font-size:11.5px;color:#A99D92}
.trace .tlegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* modal / sheet */
body.modal-open{overflow:hidden}
.ov{position:fixed;inset:0;z-index:96;background:rgba(25,21,18,.56);display:grid;place-items:center;padding:20px}
.sheet{background:var(--card);border-radius:var(--r-xl);width:min(540px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;box-shadow:var(--sh-pop)}
.sheet h3{margin:0;font-size:24px;letter-spacing:-.035em;font-weight:500}

/* STAYFOLD EDITORIAL SYSTEM · type-led redesign */
:root{--bg:#F3F0EB;--bg-warm:#EAE4DC;--card:#FFF;--soft:#F7F4EF;--espresso:#2A1D1A;--espresso-2:#382925;--ink:#2A1D1A;--ink-2:#665D58;--mut:#857B75;--mut-2:#A69D97;--line:#CFC8C1;--line-2:#E1DCD6;--brand:#6E3837;--brand-text:#6E3837;--brand-tint:#F0E6E2;--cta:#2A1D1A;--cta-hover:#46332E;--track:#EAE6E0;--r-card:4px;--r-photo:2px;--r-xl:4px;--r-hero:2px;--sh:0 18px 50px rgba(42,29,26,.055);--sh-pop:0 24px 80px rgba(42,29,26,.18);--gut:clamp(22px,5.4vw,88px)}

.top-in{min-height:86px;padding-top:14px;padding-bottom:14px}.logo{gap:12px;font-size:24px;font-weight:450;letter-spacing:-.05em}.logo small{font-size:9px;letter-spacing:.22em;color:var(--ink-2)}
.top .seg-lbl{font-size:9px;letter-spacing:.2em}.seg,.lang{background:transparent;border:1px solid var(--line);padding:3px}.seg button,.lang button{font-size:12px;min-height:38px}.seg button[aria-pressed=true],.lang button[aria-pressed=true]{background:var(--espresso);color:#fff;box-shadow:none}
.trace-btn{min-height:46px;font-size:12px;padding:0 17px;background:transparent;color:var(--espresso);border:1px solid var(--espresso)}.gnav{padding:20px 0 0;border-bottom:1px solid var(--line);gap:26px}.tab{padding:0 0 10px;border-radius:0;min-height:34px;font-size:12px;letter-spacing:.05em}.tab[aria-current=true]{background:none;box-shadow:none;border-bottom:1px solid var(--espresso)}

.herox{position:relative}.hero{grid-template-columns:minmax(0,1.04fr) minmax(430px,.96fr);gap:clamp(34px,6vw,100px);padding:70px 0 0;min-height:700px}.hero-l{padding:0 0 150px;gap:60px;justify-content:flex-start}.hero-top{align-items:flex-start}

.feat{padding:140px 0 35px}.sh{align-items:flex-end;margin-bottom:42px}.sh h2{font-size:clamp(58px,7vw,108px);font-weight:180;line-height:.84;letter-spacing:-.07em;text-transform:lowercase}.sh p{font-size:13px;margin-top:20px;padding-left:74px;position:relative}.sh p::before{content:"";position:absolute;left:0;top:.8em;width:50px;border-top:1px solid var(--line)}.navr .pc{font-family:var(--serif);font-size:16px}.pline{height:1px;background:var(--line);width:120px}.pline i{height:1px;background:var(--espresso)}
.track{grid-auto-columns:calc((100cqw - 60px)/3.25);gap:20px}.fintro{border-radius:0;border-top:1px solid var(--espresso);background:transparent;padding:24px 0}.fintro h3{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05}.fcard .ph{border-radius:0;aspect-ratio:4/5.15}.fcard:nth-child(odd) .ph{aspect-ratio:4/4.45;margin-top:44px}.fcard .ph img{filter:saturate(.72)}.fcard .cap{padding-top:3px;border-top:1px solid var(--line);margin-top:12px}.fcard .cap b{font-size:13px;font-weight:500}.fcard .cap span{font-family:var(--serif);font-size:17px;color:var(--espresso)}
.big{text-align:left;padding:150px 0 36px;border-bottom:1px solid var(--line)}.big .w{font-size:clamp(82px,14vw,215px);font-weight:150;line-height:.72;letter-spacing:-.085em;margin:28px 0 25px;text-align:center}.big .w::after{content:" · 09";font-family:var(--serif);font-size:.14em;letter-spacing:.05em;vertical-align:top;margin-left:.5em}.big p{margin:0;max-width:42ch;font-size:13px}.areas{justify-content:flex-end;margin-top:-36px}.areas .seg{border:0;background:transparent;padding:0;gap:22px}.areas .seg button{border-radius:0;border-bottom:1px solid transparent;padding:0 2px;min-height:36px}.areas .seg button[aria-pressed=true]{background:transparent;color:var(--espresso);border-color:var(--espresso)}
.res-head{padding:34px 0 18px}.res-head h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}.res-head h2 .num{font-size:22px;margin-left:5px;font-weight:400}
/* rooms */

const overlap=(a1,b1,a2,b2)=>a1<b2&&a2<b1;
function check(r,inS,outS,except){
 if(!inS||!outS)return t('errOrder');
 if(pd(outS)<=pd(inS))return t('errOrder');
 if(pd(inS)<pd(r.avail))return t('errAvail')+' '+fd(r.avail);
 if(quote(r,inS,outS).m<1)return t('errMin');
 if(blocks(r.id,except).some(a=>overlap(inS,outS,a.in,a.out)))return t('errOverlap');
 return '';
}

 :`<div class="empty"><b>${t('noTrips')}</b>${t('noTripsP')}<div style="margin-top:14px"><button class="btn brand sm" data-act="gview" data-v="search">${t('goFind')}</button></div></div>`;

/* ---------------- toast / modal ---------------- */
let tt;
function toast(msg,withLog){
 clearTimeout(tt);const l=document.getElementById('layer');
 const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
 el.innerHTML=`<span>${esc(msg)}</span>${withLog&&!document.body.classList.contains('trace-open')?`<button data-act="trace">${t('seeLog')}</button>`:''}`;
 document.querySelectorAll('.toast').forEach(x=>x.remove());document.body.appendChild(el);
 tt=setTimeout(()=>el.remove(),4200);
}
let lastFocus=null,traceLastFocus=null;
function modal(html){document.querySelectorAll('.toast').forEach(x=>x.remove());if(!document.querySelector('.ov'))lastFocus=document.activeElement;document.getElementById('layer').innerHTML=`<div class="ov" data-act="ovclose"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">${html}</div></div>`;const h=document.querySelector('.sheet h3');if(h)h.id='sheet-h';document.body.classList.add('modal-open');['app','top','trace'].forEach(i=>{const e=document.getElementById(i==='top'?'top':i);if(e)e.inert=true});const f=document.querySelector('.sheet button:not(.x),.sheet input')||document.querySelector('.sheet button');if(f)f.focus()}
const closeModal=()=>{document.getElementById('layer').innerHTML='';document.body.classList.remove('modal-open');['app','top','trace'].forEach(i=>{const e=document.getElementById(i);if(e)e.inert=false});if(lastFocus&&document.contains(lastFocus))lastFocus.focus();lastFocus=null};
const wide=()=>window.matchMedia('(min-width:1180px)').matches;
function openTrace(force){const panel=document.getElementById('trace');if(force===false){document.body.classList.remove('trace-open');panel.setAttribute('aria-hidden','true');panel.inert=true;panel.removeAttribute('role');panel.removeAttribute('aria-modal');renderTop();if(traceLastFocus&&document.contains(traceLastFocus))traceLastFocus.focus();else document.querySelector('.trace-btn')?.focus();traceLastFocus=null;return}
 traceLastFocus=document.activeElement;document.body.classList.add('trace-open');panel.removeAttribute('aria-hidden');panel.inert=false;if(!wide()){panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true')}DB.unseen=0;save();renderTrace();renderTop();if(!wide())requestAnimationFrame(()=>panel.querySelector('.x')?.focus());}
